const schedule = document.getElementById("schedule");
Object.keys(months).sort((a, b) => {
    const [yearA, monthA] = a.split('-').map(Number);
    const [yearB, monthB] = b.split('-').map(Number);
    return yearA - yearB || monthA - monthB;
}).forEach(key => {
    const month = months[key];
    const anchor = month.name.replace(" ", "-");
    schedule.innerHTML += `<section id="${anchor}"><h2>${month.name}</h2><ul></ul><div class="back-to-top"><a href="#top">↑ Top</a></div></section>`;
    const ul = schedule.lastChild.querySelector("ul");
    month.events.forEach(ev => {
        const seriesClass = getSeriesClass(ev.series);
        const dateStr = ev.end && ev.end !== ev.start ? 
            `${new Date(ev.start).toLocaleDateString('en-US', {month: 'short', day: 'numeric', timeZone: 'UTC'})}–${new Date(ev.end).toLocaleDateString('en-US', {month: 'short', day: 'numeric', timeZone: 'UTC'})}` : 
            new Date(ev.start).toLocaleDateString('en-US', {month: 'short', day: 'numeric', timeZone: 'UTC'});

        ul.innerHTML += `<li class="${seriesClass}">
            <span class="date">${dateStr}</span> 
            <span class="series">[${ev.series}]</span> 
            ${ev.event} — ${ev.venue}
            ${ev.notes ? `<span class="notes">(${ev.notes})</span>` : ''}
        </li>`;
    });
});
    </script>
</body>
</html>
